<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8">

<script src="js/theme-init.js"></script>
<title>Englisify — Kosakata</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/supabase.js"></script>
<script src="js/auth.js" data-guard="protected"></script>
</head>
<body>

<div class="app-shell">

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-badge">
        <svg class="icon" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      </div>
      <span class="brand-name">Englisify</span>
    </div>
    <ul class="nav-list">
      <li><a class="nav-link" href="beranda.html">
        <svg class="icon" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
        Beranda</a></li>
      <li><a class="nav-link" href="flashcard.html">
        <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="14" height="16" rx="2"/><path d="M17 8h4v12H7"/></svg>
        Flashcard</a></li>
      <li><a class="nav-link" href="reading-test.html">
        <svg class="icon" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><path d="M9 13h6M9 17h6"/></svg>
        Reading Test</a></li>
      <li><a class="nav-link active" href="kosakata.html">
        <svg class="icon" viewBox="0 0 24 24"><path d="M4 19V5a2 2 0 0 1 2-2h13v18H6a2 2 0 0 1-2-2z"/><path d="M4 19a2 2 0 0 1 2-2h13"/></svg>
        Kosakata</a></li>
      <li><a class="nav-link" href="ujian-level.html">
        <svg class="icon" viewBox="0 0 24 24"><path d="M12 2 4 5v6c0 5 3.4 8.7 8 11 4.6-2.3 8-6 8-11V5z"/></svg>
        Ujian Level</a></li>
      <li><a class="nav-link" href="settings.html">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M4 12h2m12 0h2M12 4v2m0 12v2M6.3 6.3l1.4 1.4m8.6 8.6 1.4 1.4M6.3 17.7l1.4-1.4m8.6-8.6 1.4-1.4"/></svg>
        Pengaturan</a></li>
    </ul>
    <a class="sidebar-user" href="profile.html">
      <div class="avatar">BS</div>
      <div class="user-meta">
        <div class="u-name">Budi Santoso</div>
        <div class="u-level">Level B1</div>
      </div>
    </a>
  </aside>

  <div class="main-col">
    <header class="topbar">
      <button class="menu-toggle" aria-label="Buka menu">
        <svg class="icon" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div class="search-box">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" placeholder="Cari kata, materi, atau fitur...">
      </div>
      <div class="topbar-right">
        <div class="theme-toggle">
          <button class="theme-btn" data-mode="light" title="Terang"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
          <button class="theme-btn" data-mode="dark" title="Gelap"><svg class="icon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg></button>
        </div>
        <div class="avatar-menu">
          <button class="avatar sm" id="avatarMenuBtn" type="button" aria-label="Menu akun">BS</button>
          <span class="avatar-chevron" aria-hidden="true">
            <svg class="icon" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
          </span>
          <div class="dropdown" id="avatarDropdown">
            <button data-nav="profile.html">
              <svg class="icon" viewBox="0 0 24 24" style="width:14px;height:14px;"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
              Profil Saya
            </button>
            <button data-nav="settings.html">
              <svg class="icon" viewBox="0 0 24 24" style="width:14px;height:14px;"><circle cx="12" cy="12" r="3"/><path d="M4 12h2m12 0h2M12 4v2m0 12v2M6.3 6.3l1.4 1.4m8.6 8.6 1.4 1.4M6.3 17.7l1.4-1.4m8.6-8.6 1.4-1.4"/></svg>
              Pengaturan
            </button>
            <button id="btnLogout" class="danger">
              <svg class="icon" viewBox="0 0 24 24" style="width:14px;height:14px;"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
              Keluar
            </button>
          </div>
        </div>
      </div>
    </header>

    <main class="content">
      <div class="card-row" style="margin-bottom:18px;">
        <h1 style="font-size:19px;font-weight:700;">Kosakata</h1>
        <button class="btn btn-primary" id="btnAddWord">
          <svg class="icon" viewBox="0 0 24 24" style="width:16px;height:16px;"><path d="M12 5v14M5 12h14"/></svg>
          Tambah Kata Baru
        </button>
      </div>

      <div class="card card-pad">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:4px;">
          <div class="tabs" id="vocabTabs">
            <button class="tab-btn active" data-filter="semua">Semua</button>
            <button class="tab-btn" data-filter="dipelajari">Dipelajari</button>
            <button class="tab-btn" data-filter="review">Perlu Review</button>
          </div>
          <div class="search-box" style="max-width:240px;">
            <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
            <input type="text" id="vocabSearch" placeholder="Cari kata...">
          </div>
        </div>

        <div style="overflow-x:auto;">
          <table class="vocab-table">
            <thead>
              <tr>
                <th>Kata</th>
                <th>Arti</th>
                <th>Jenis</th>
                <th>Terakhir Dipelajari</th>
                <th>Review Berikutnya</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="vocabBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Add word modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3>Tambah Kata Baru</h3>
    <form id="addWordForm">
      <div class="field">
        <label>Kata (Bahasa Inggris)</label>
        <input type="text" id="fWord" placeholder="contoh: journey" required>
      </div>
      <div class="field">
        <label>Arti (Bahasa Indonesia)</label>
        <input type="text" id="fMeaning" placeholder="contoh: perjalanan" required>
      </div>
      <div class="field">
        <label>Jenis Kata</label>
        <select id="fType">
          <option value="noun">Kata benda</option>
          <option value="verb">Kata kerja</option>
          <option value="adjective">Kata sifat</option>
        </select>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-outline" id="btnCancelAdd">Batal</button>
        <button type="submit" class="btn btn-primary">Simpan Kata</button>
      </div>
    </form>
  </div>
</div>

<script src="js/main.js"></script>
<script src="js/kosakata.js"></script>
</body>
</html>
